<svg xmlns="http://www.w3.org/2000/svg" width="520" height="680" viewBox="0 0 520 680" role="img" aria-labelledby="title desc"><title id="title">A Trailing Three-Day Frame</title><desc id="desc">At March 4, the three-day total is 160 USD. March 1 is outside this frame.</desc><rect width="520" height="680" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
<text x="260" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033">A Trailing Three-Day Frame</text>
<rect x="60" y="100" width="400" height="110" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="260" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">March 2</text>
<text x="260" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Gross = 110 USD</text>
<path d="M260,210 V270" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="270" width="400" height="110" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="260" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">March 3</text>
<text x="260" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Gross = 50 USD</text>
<path d="M260,380 V440" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="440" width="400" height="110" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="260" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">March 4</text>
<text x="260" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Gross = 0 USD</text>
<text x="260" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">At March 4, the three-day total is 160 USD. March 1 is</text>
<text x="260" y="626.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">outside this frame.</text>
</svg>
