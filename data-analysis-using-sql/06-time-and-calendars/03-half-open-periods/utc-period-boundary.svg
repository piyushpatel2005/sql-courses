<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc"><title id="title">Adjacent UTC Months Do Not Overlap</title><desc id="desc">January ends before February 1. The same instant belongs to February once.</desc><rect width="1080" height="370" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
<text x="540" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172033">Adjacent UTC Months Do Not Overlap</text>
<rect x="40" y="100" width="290" height="130" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="185" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172033">January Window</text>
<text x="185" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Start included</text>
<path d="M330,165 H395" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="395" y="100" width="290" height="130" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="540" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172033">February 1 At 00:00</text>
<text x="540" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Excluded from January</text>
<path d="M685,165 H750" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="100" width="290" height="130" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="895" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172033">February Window</text>
<text x="895" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Boundary included</text>
<text x="540" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">January ends before February 1. The same instant belongs to February once.</text>
</svg>