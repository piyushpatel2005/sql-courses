<svg xmlns="http://www.w3.org/2000/svg" width="520" height="680" viewBox="0 0 520 680" role="img" aria-labelledby="title desc"><title id="title">Adjacent UTC Months Do Not Overlap</title><desc id="desc">January ends before February 1. The same instant belongs to February once.</desc><rect width="520" height="680" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
<text x="260" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033">Adjacent UTC Months Do Not Overlap</text>
<rect x="60" y="100" width="400" height="110" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="260" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">January Window</text>
<text x="260" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Start included</text>
<path d="M260,210 V270" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="270" width="400" height="110" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="260" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">February 1 At 00:00</text>
<text x="260" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Excluded from January</text>
<path d="M260,380 V440" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="440" width="400" height="110" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="260" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">February Window</text>
<text x="260" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Boundary included</text>
<text x="260" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">January ends before February 1. The same instant</text>
<text x="260" y="626.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">belongs to February once.</text>
</svg>
