<svg xmlns="http://www.w3.org/2000/svg" width="520" height="680" viewBox="0 0 520 680" role="img" aria-labelledby="title desc"><title id="title">Reduce Refunds Before Joining</title><desc id="desc">Aggregate the child at order grain; do not repeat the parent amount.</desc><rect width="520" height="680" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
<text x="260" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033">Reduce Refunds Before Joining</text>
<rect x="60" y="100" width="400" height="110" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="260" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">Order 101</text>
<text x="260" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Gross = 40 USD</text>
<path d="M260,210 V270" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="270" width="400" height="110" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="260" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">Two Refund Events</text>
<text x="260" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">5 + 3 = 8 USD</text>
<path d="M260,380 V440" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="440" width="400" height="110" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="260" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">One Ledger Row</text>
<text x="260" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Net = 32 USD</text>
<text x="260" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Aggregate the child at order grain; do not repeat the</text>
<text x="260" y="626.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">parent amount.</text>
</svg>
