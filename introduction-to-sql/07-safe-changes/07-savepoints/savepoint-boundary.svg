<svg xmlns="http://www.w3.org/2000/svg" width="520" height="538" viewBox="0 0 520 538" role="img" aria-labelledby="title desc"><title id="title">Keep the Correction, Undo the Trial</title><desc id="desc">Within BEGIN, Soup is corrected to 5.50 before SAVEPOINT price_checked. Tea is tried at 99 afterward. ROLLBACK TO price_checked discards the Tea change, then COMMIT accepts the Soup correction.</desc><rect width="520" height="538" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<text x="260" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Keep the Correction, Undo the Trial</text>
<text x="260" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">One transaction; the savepoint is not a commit</text>
<rect x="30" y="88" width="460" height="105" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="260" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">BEGIN: Keep the Correction</text>
<text x="260" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Set Soup’s price to 5.50.</text>
<text x="260" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">SAVEPOINT price_checked marks this state.</text>
<rect x="30" y="235" width="460" height="105" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="260" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">Try a Later Change</text>
<text x="260" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Set Tea’s price to 99.</text>
<text x="260" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">ROLLBACK TO price_checked undoes this trial.</text>
<rect x="30" y="382" width="460" height="132" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="260" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">COMMIT: Accept What Remains</text>
<text x="260" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Soup stays 5.50; Tea returns to 2.50.</text>
<text x="260" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Cake stays 4.00; Coffee stays 3.00.</text>
<text x="260" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">A full ROLLBACK would undo Soup too.</text>
<path d="M 260 193 L 260 235" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 260 340 L 260 382" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
